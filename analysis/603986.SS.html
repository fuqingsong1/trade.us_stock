    var salt = Uint8Array.from(atob(P.salt), function (c) { return c.charCodeAt(0); });

    }).then(function (pt) { return new TextDecoder().decode(pt); });

      if (!ok) { try { localStorage.removeItem("caicai_pw"); } catch (e) {} $("msg").textContent = ""; }

})();
