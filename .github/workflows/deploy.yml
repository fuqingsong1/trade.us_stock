name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 每5分钟自动更新一次（需要在仓库 Settings > Secrets 配置 API 密钥后启用）
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 可选：自动生成最新看板数据 ----
      # 启用前需在 Settings > Secrets and variables > Actions 中添加:
      #   OKX_API_KEY, OKX_API_SECRET, OKX_PASSPHRASE
      #   WORKSPACE_ROOT (设为 /tmp/trader)
      # 然后取消下面这整段注释:
      #
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.10'
      # - name: Install dependencies
      #   run: pip install requests urllib3
      # - name: Generate dashboard
      #   env:
      #     OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      #     OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
      #     OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
      #     WORKSPACE_ROOT: ${{ secrets.WORKSPACE_ROOT || '/tmp/trader' }}
      #   run: |
      #     mkdir -p /tmp/trader/watchlist_us
      #     echo '{}' > /tmp/trader/watchlist_us/config.json
      #     python dashboard.py --no-open
      #     cp dashboard.html index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
